name: Release container

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
      - name: Validate release
        id: release
        env:
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          package_version="$(node -p "require('./package.json').version")"

          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-beta\.(0|[1-9][0-9]*)$' || {
              echo "Pre-release tags must look like v0.2.0-beta.1"
              exit 1
            }
            channel=beta
          else
            echo "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || {
              echo "Stable release tags must look like v0.1.0"
              exit 1
            }
            channel=latest
          fi

          if [ "$package_version" != "$version" ]; then
            echo "package.json is $package_version, but the release is $version"
            exit 1
          fi

          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Promote tested image
        env:
          CHANNEL: ${{ steps.release.outputs.channel }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/folio
          REVISION: ${{ steps.release.outputs.revision }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          source_image="$IMAGE:sha-$REVISION"
          source_digest="$(docker buildx imagetools inspect "$source_image" | awk '$1 == "Digest:" { print $2; exit }')"
          version_image="$IMAGE:$VERSION"
          existing_digest="$(docker buildx imagetools inspect "$version_image" 2>/dev/null | awk '$1 == "Digest:" { print $2; exit }' || true)"

          if [ -n "$existing_digest" ] && [ "$existing_digest" != "$source_digest" ]; then
            echo "$version_image already points to a different image and will not be overwritten"
            exit 1
          fi

          docker buildx imagetools create \
            --tag "$version_image" \
            --tag "$IMAGE:$CHANNEL" \
            "$IMAGE@$source_digest"
          docker buildx imagetools inspect "$version_image"
