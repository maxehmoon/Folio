name: Publish container

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1
    permissions:
      contents: read
      packages: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      sign: "false"
      labels: |
        org.opencontainers.image.description=Self-hosted invoicing
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.source=https://github.com/${{ github.repository }}
      meta-images: ghcr.io/${{ github.repository_owner }}/folio
      meta-tags: |
        type=raw,value=candidate
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  smoke-test:
    name: Smoke test (${{ matrix.platform }})
    needs: publish
    permissions:
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start and check published image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/folio@${{ needs.publish.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker pull --platform "$PLATFORM" "$IMAGE"
          docker run --detach --name folio-smoke \
            --platform "$PLATFORM" \
            --env APP_SECRET=folio-smoke-test-secret-at-least-32-characters \
            --env SETUP_TOKEN=folio-smoke-test-token-at-least-32-characters \
            --publish 127.0.0.1:3000:3000 \
            "$IMAGE"

          trap 'docker logs folio-smoke; docker rm --force folio-smoke' EXIT
          timeout 60 sh -c 'until curl --fail --silent http://127.0.0.1:3000/api/health/ready; do sleep 2; done'

  promote-edge:
    name: Promote edge image
    needs: [publish, smoke-test]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Promote tested image
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/folio
          REVISION: ${{ github.sha }}
        run: |
          source_image="$IMAGE@$DIGEST"
          revision_image="$IMAGE:sha-$REVISION"
          existing_digest="$(docker buildx imagetools inspect "$revision_image" 2>/dev/null | awk '$1 == "Digest:" { print $2; exit }' || true)"

          if [ -n "$existing_digest" ]; then
            source_image="$IMAGE@$existing_digest"
          else
            docker buildx imagetools create --tag "$revision_image" "$source_image"
          fi

          docker buildx imagetools create --tag "$IMAGE:edge" "$source_image"
          docker buildx imagetools inspect "$IMAGE:edge"
