name: folio

services:
  folio:
    image: ghcr.io/maxehmoon/folio:latest
    init: true
    restart: unless-stopped
    ports:
      - "${FOLIO_BIND_ADDRESS:-127.0.0.1}:${FOLIO_PORT:-3000}:3000"
    environment:
      DATABASE_DIALECT: sqlite
      FOLIO_DATA_DIR: ${FOLIO_DATA_DIR:-/data}
      APP_SECRET: ${APP_SECRET:-${BETTER_AUTH_SECRET:-}}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      CRON_SECRET: ${CRON_SECRET:-}
      DEBUG: ${DEBUG:-false}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-}
      DEFAULT_COUNTRY: ${DEFAULT_COUNTRY:-}
    volumes:
      - folio_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    security_opt:
      - no-new-privileges:true

volumes:
  folio_data:
